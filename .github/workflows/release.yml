name: release

on:
  push:
    tags:
      - "pluginprotocol-v3.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify module and tests
        run: |
          test "$(sed -n '1p' go.mod)" = "module github.com/Liapoldus/pluginprotocol/v3"
          go test ./...
          go vet ./...
      - name: Package source artifact
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#pluginprotocol-}"
          artifact="pluginprotocol-${version}.tar.gz"
          git archive --format=tar --prefix="pluginprotocol-${version}/" "${GITHUB_SHA}" | gzip -n > "${artifact}"
          sha256sum "${artifact}" > "${artifact}.sha256"
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: protocol-${{ github.ref_name }}.sbom.spdx.json
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.1
      - name: Sign release artifact and SBOM
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#pluginprotocol-}"
          artifact="pluginprotocol-${version}.tar.gz"
          sbom="protocol-${VERSION}.sbom.spdx.json"
          cosign sign-blob --yes --bundle "${artifact}.sigstore.json" "${artifact}"
          cosign sign-blob --yes --bundle "${sbom}.sigstore.json" "${sbom}"
      - name: Attest release provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: pluginprotocol-*.tar.gz
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            pluginprotocol-*
            protocol-${{ github.ref_name }}.sbom.spdx.json
            protocol-${{ github.ref_name }}.sbom.spdx.json.sigstore.json

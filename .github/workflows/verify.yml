name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - uses: arduino/setup-protoc@v3
        with:
          version: 34.1
      - run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
      - run: npm ci --prefix tests
      - run: make check
      # The race detector is a gate, not a suggestion: the same scenarios run with
      # every Go fixture built under -race, so a data race in the transport or the
      # connection engine fails the build instead of surfacing in production.
      - run: make check-race

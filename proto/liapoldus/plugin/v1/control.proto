syntax = "proto3";

package liapoldus.plugin.v1;

option go_package = "github.com/Liapoldus/pluginprotocol/pluginv1;pluginv1";

message ManifestRequest {}

message Manifest {
  string name = 1;
  repeated string capabilities = 2;
  string protocol_version = 3;
  repeated CapabilityDescriptor capability_descriptors = 4;
}

enum InvocationMode {
  INVOCATION_MODE_UNSPECIFIED = 0;
  INVOCATION_MODE_CALL = 1;
  INVOCATION_MODE_HTTP_STREAM = 2;
  INVOCATION_MODE_WEBSOCKET = 3;
  INVOCATION_MODE_SSE = 4;
  INVOCATION_MODE_TCP = 5;
  INVOCATION_MODE_UDP = 6;
}

message CapabilityDescriptor {
  string capability = 1;
  repeated InvocationMode modes = 2;
}

message ConfigSchemaRequest {}

message ConfigField {
  string name = 1;
  string type = 2;
  bool required = 3;
  string default_json = 4;
  repeated string options = 5;
  string description = 6;
}

message ConfigSchema { repeated ConfigField fields = 1; }
message ConfigApplyRequest { bytes config = 1; }
message ConfigApplyResult { bool applied = 1; }
message ShutdownRequest {}
message ShutdownResult { bool closed = 1; }

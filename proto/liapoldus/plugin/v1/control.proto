syntax = "proto3";

package liapoldus.plugin.v1;

option go_package = "github.com/Liapoldus/pluginprotocol/pluginv1;pluginv1";

message ManifestRequest {}

message Manifest {
  string name = 1;
  repeated string capabilities = 2;
  string protocol_version = 3;
  repeated CapabilityDescriptor capability_descriptors = 4;
}

enum InvocationMode {
  INVOCATION_MODE_UNSPECIFIED = 0;
  INVOCATION_MODE_CALL = 1;
  INVOCATION_MODE_HTTP_STREAM = 2;
  INVOCATION_MODE_WEBSOCKET = 3;
  INVOCATION_MODE_SSE = 4;
  INVOCATION_MODE_TCP = 5;
  INVOCATION_MODE_UDP = 6;
}

message CapabilityDescriptor {
  string capability = 1;
  repeated InvocationMode modes = 2;
}

// DispatchApply replaces the complete active data-plane authorization scope
// for one logical plugin instance on the connected replica. Applying a
// request is atomic: on failure, the previous generation remains active.
// Generations start at 1 and increase monotonically per replica. An identical
// request repeated at the current generation is idempotent; a stale generation
// or a different request at the current generation is rejected.
message DispatchApplyRequest {
  uint64 generation = 1;
  string instance_id = 2;
  string settings_digest = 3;
  string release_digest = 4;
  repeated CapabilityDispatchScope capabilities = 5;
}

// Each capability is unique in one request and has one or more unique,
// non-unspecified modes declared by the replica's Manifest. An empty
// capabilities list installs deny-all for this generation.
message CapabilityDispatchScope {
  string capability = 1;
  repeated InvocationMode modes = 2;
}

// A successful response is emitted only after this replica has installed the
// requested generation. replica_identity_uri identifies the connected remote
// replica and must match its URI SAN as verified by the Gateway TLS peer.
// Settings and release digests acknowledge the replica-local active values.
// dispatch_digest is a non-empty opaque identifier for the installed complete
// capability-to-mode scope; v1 does not standardize its encoding.
message DispatchApplyResponse {
  uint64 generation = 1;
  string replica_identity_uri = 2;
  string manifest_digest = 3;
  string settings_digest = 4;
  string release_digest = 5;
  string dispatch_digest = 6;
}

message ConfigSchemaRequest {}

message ConfigField {
  string name = 1;
  string type = 2;
  bool required = 3;
  string default_json = 4;
  repeated string options = 5;
  string description = 6;
}

message ConfigSchema { repeated ConfigField fields = 1; }
message ConfigApplyRequest { bytes config = 1; }
message ConfigApplyResult { bool applied = 1; }
message ShutdownRequest {}
message ShutdownResult { bool closed = 1; }

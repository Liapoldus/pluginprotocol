syntax = "proto3";

package liapoldus.plugin.v1;

option go_package = "github.com/Liapoldus/pluginprotocol/pluginv1;pluginv1";

import "liapoldus/plugin/v1/control.proto";
import "liapoldus/plugin/v1/grant.proto";

service PluginService {
  rpc Manifest(ManifestRequest) returns (.liapoldus.plugin.v1.Manifest);
  rpc ConfigSchema(ConfigSchemaRequest) returns (.liapoldus.plugin.v1.ConfigSchema);
  rpc ConfigApply(ConfigApplyRequest) returns (ConfigApplyResult);
  rpc Shutdown(ShutdownRequest) returns (ShutdownResult);
  rpc DispatchApply(DispatchApplyRequest) returns (DispatchApplyResponse);
  rpc Call(CallRequest) returns (CallResponse);
  rpc Stream(stream StreamMessage) returns (stream StreamMessage);
}

message CallRequest {
  string capability = 1;
  bytes payload = 2;
  repeated ActiveGrant grants = 3;
}

message CallResponse {
  bytes payload = 1;
  string code = 2;
  string message = 3;
}

message PluginEvent {
  string level = 1;
  string message = 2;
  map<string, string> fields = 3;
}

enum StreamTransport {
  STREAM_TRANSPORT_UNSPECIFIED = 0;
  STREAM_TRANSPORT_TCP = 1;
  STREAM_TRANSPORT_UDP = 2;
}

enum StreamDirection {
  STREAM_DIRECTION_UNSPECIFIED = 0;
  STREAM_DIRECTION_REQUEST = 1;
  STREAM_DIRECTION_RESPONSE = 2;
}

enum StreamCloseCode {
  STREAM_CLOSE_CODE_NORMAL = 0;
  STREAM_CLOSE_CODE_DROP = 1;
  STREAM_CLOSE_CODE_ERROR = 2;
}

enum WebSocketMessageKind {
  WEBSOCKET_MESSAGE_KIND_UNSPECIFIED = 0;
  WEBSOCKET_MESSAGE_KIND_TEXT = 1;
  WEBSOCKET_MESSAGE_KIND_BINARY = 2;
}

message StreamOpen {
  StreamTransport transport = 1;
  string connection_id = 2;
  bytes context_json = 3;
  optional InvocationMode mode = 4;
}

message StreamData {
  bytes payload = 1;
  StreamDirection direction = 2;
}

message StreamClose {
  StreamCloseCode code = 1;
}

message HttpRequestChunk {
  bytes payload = 1;
  bool end_stream = 2;
}

message HttpResponseStart {
  uint32 status_code = 1;
  bytes metadata_json = 2;
}

message HttpResponseChunk {
  bytes payload = 1;
  bool end_stream = 2;
}

message WebSocketHandshakeResult {
  bool accepted = 1;
  string subprotocol = 2;
  bytes metadata_json = 3;
}

message WebSocketMessage {
  WebSocketMessageKind kind = 1;
  bytes payload = 2;
  StreamDirection direction = 3;
}

message SseEvent {
  string data = 1;
  string event = 2;
  string id = 3;
  optional uint32 retry_millis = 4;
}

message StreamMessage {
  string capability = 1;
  oneof body {
    // Deprecated untyped payload. Use data for L4 bytes.
    bytes payload = 2;
    PluginEvent event = 3;
    StreamOpen open = 4;
    StreamData data = 5;
    StreamClose close = 6;
    HttpRequestChunk http_request_chunk = 7;
    HttpResponseStart http_response_start = 8;
    HttpResponseChunk http_response_chunk = 9;
    WebSocketHandshakeResult websocket_handshake = 10;
    WebSocketMessage websocket_message = 11;
    SseEvent sse_event = 12;
  }
}

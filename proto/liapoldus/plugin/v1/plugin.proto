syntax = "proto3";

package liapoldus.plugin.v1;

option go_package = "github.com/Liapoldus/pluginprotocol/pluginv1;pluginv1";

enum FrameKind {
  FRAME_KIND_UNSPECIFIED = 0;
  CALL = 1;
  CALL_RESULT = 2;
  STREAM_OPEN = 3;
  STREAM_DATA = 4;
  STREAM_CLOSE = 5;
  CANCEL = 6;
  EVENT = 7;
  ERROR = 8;
}

message Frame {
  FrameKind kind = 1;
  uint64 request_id = 2;
  uint64 stream_id = 3;
  bytes payload = 4;
}

message Error {
  string code = 1;
  string message = 2;
  bool retryable = 3;
}

message Envelope {
  string method = 1;
  string capability = 2;
  map<string, string> metadata = 3;
  bytes payload = 4;
  Error error = 5;
}

message Event {
  string level = 1;
  string message = 2;
  map<string, string> fields = 3;
}

message Manifest {
  string name = 1;
  repeated string capabilities = 2;
  string protocol_version = 3;
}

message Health { bool ready = 1; }

message ConfigField {
  string name = 1;
  string type = 2;
  bool required = 3;
  string default_json = 4;
  repeated string options = 5;
  string description = 6;
}

message ConfigSchema { repeated ConfigField fields = 1; }
message ConfigApplyResult { bool applied = 1; }
message ShutdownResult { bool closed = 1; }

syntax = "proto3";

package liapoldus.plugin.v1;

option go_package = "github.com/Liapoldus/pluginprotocol/pluginv1;pluginv1";

enum FrameKind {
  FRAME_KIND_UNSPECIFIED = 0;
  CALL = 1;
  CALL_RESULT = 2;
  STREAM_OPEN = 3;
  STREAM_DATA = 4;
  STREAM_CLOSE = 5;
  CANCEL = 6;
  EVENT = 7;
  ERROR = 8;
}

message Frame {
  FrameKind kind = 1;
  uint64 request_id = 2;
  uint64 stream_id = 3;
  bytes payload = 4;
}
